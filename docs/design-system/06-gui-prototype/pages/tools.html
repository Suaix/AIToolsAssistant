            <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>

      <main class="app-main">
        <header class="app-main__header">
          <h1 class="app-main__title">已连接工具</h1>
          <div style="display:flex; gap: var(--space-2); align-items:center;">
            <button class="btn btn--primary btn--sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              连接新工具
            </button>
            <button class="btn btn--ghost btn--icon btn--sm" data-theme-toggle aria-label="切换主题">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
          </div>
        </header>

        <div class="app-main__content">
          <div class="card-stack" style="max-width: 720px;">

            <!-- CodeBuddy -->
            <article class="card">
              <header class="card__header">
                <div style="display:flex; align-items:center; gap: var(--space-3);">
                  <div style="width:40px; height:40px; border-radius: var(--radius-md); background: var(--color-brand-subtle); color: var(--color-brand-default); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;">C</div>
                  <div>
                    <h3 class="card__title" style="margin-bottom: 2px;">CodeBuddy</h3>
                    <span class="badge badge--success badge--sm"><span class="badge__dot"></span>已连接</span>
                  </div>
                </div>
                <button class="btn btn--ghost btn--icon btn--sm" aria-label="更多">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
              </header>
              <div class="card__meta font-mono">~/.codebuddy/</div>
              <p class="card__desc tabular-nums" style="color: var(--color-text-primary);">
                12 Skill · 最近同步：2 分钟前
              </p>
              <div class="card__footer">
                <button class="btn btn--secondary btn--sm">查看目录</button>
                <button class="btn btn--danger btn--sm" style="margin-left:auto;">断开连接</button>
              </div>
            </article>

            <!-- Claude Code -->
            <article class="card">
              <header class="card__header">
                <div style="display:flex; align-items:center; gap: var(--space-3);">
                  <div style="width:40px; height:40px; border-radius: var(--radius-md); background: var(--color-brand-subtle); color: var(--color-brand-default); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;">CC</div>
                  <div>
                    <h3 class="card__title" style="margin-bottom: 2px;">Claude Code</h3>
                    <span class="badge badge--success badge--sm"><span class="badge__dot"></span>已连接</span>
                  </div>
                </div>
                <button class="btn btn--ghost btn--icon btn--sm" aria-label="更多">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
              </header>
              <div class="card__meta font-mono">~/.claude/</div>
              <p class="card__desc tabular-nums" style="color: var(--color-text-primary);">
                11 Skill · 最近同步：10 分钟前
              </p>
              <div class="card__footer">
                <button class="btn btn--secondary btn--sm">查看目录</button>
                <button class="btn btn--danger btn--sm" style="margin-left:auto;">断开连接</button>
              </div>
            </article>

            <!-- Cursor 预留 -->
            <article class="card" style="opacity: 0.6;">
              <header class="card__header">
                <div style="display:flex; align-items:center; gap: var(--space-3);">
                  <div style="width:40px; height:40px; border-radius: var(--radius-md); background: var(--color-bg-muted); color: var(--color-text-tertiary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px;">C</div>
                  <div>
                    <h3 class="card__title" style="margin-bottom: 2px;">Cursor</h3>
                    <span class="badge badge--neutral badge--sm"><span class="badge__dot"></span>可连接</span>
                  </div>
                </div>
              </header>
              <p class="card__desc">未来版本支持</p>
            </article>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
