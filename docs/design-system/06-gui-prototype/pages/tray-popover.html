<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>菜单栏 Popover · aitools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../../components.css" />
    <script src="../scripts/app.js" defer></script>
  </head>
  <body style="background: var(--color-bg-canvas); display:flex; flex-direction: column; align-items:center; justify-content:center; min-height: 100vh; padding: var(--space-10);">

    <!-- 标注说明 -->
    <div style="max-width: 460px; text-align:center; margin-bottom: var(--space-8);">
      <h1 style="margin: 0 0 var(--space-2); font-size: var(--text-h2-size); font-weight: var(--text-h2-weight); color: var(--color-text-primary);">菜单栏 Popover 模拟</h1>
      <p style="margin: 0; color: var(--color-text-secondary); font-size: var(--text-body-size);">
        这是 Tray App 点击菜单栏图标后弹出的 Popover，尺寸 400 × 560 px（固定）。<br/>
        Alex 80% 的使用时间在这里。
      </p>
      <button class="btn btn--ghost btn--sm" data-theme-toggle style="margin-top: var(--space-4);" aria-label="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        切换主题
      </button>
    </div>

    <!-- ====== Popover ====== -->
    <div style="width: 400px; height: 560px; background: var(--color-bg-default); border: 1px solid var(--color-border-default); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden;">

      <!-- Hero 状态区（简化版 HeroCard） -->
      <section class="hero-card hero-card--success" style="border: none; border-radius: 0; padding: var(--space-6) var(--space-6) var(--space-5); min-height: auto;">
        <div class="hero-card__bar"></div>
        <div class="hero-card__content">
          <div class="hero-card__main">
            <svg class="hero-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:22px; height:22px;">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <h2 class="hero-card__title" style="font-size: var(--text-h3-size); font-weight: var(--text-h3-weight);">全部最新</h2>
          </div>
          <p class="hero-card__sub tabular-nums" style="margin-top: 2px;">
            2 个工具 · 12 个 Skill · 刚刚同步
          </p>
        </div>
      </section>

      <!-- 搜索 -->
      <div style="padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border-default); border-bottom: 1px solid var(--color-border-default);">
        <div class="input-group">
          <svg class="input-group__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input class="input" type="search" placeholder="搜索 Skill…" />
          <kbd class="input-group__kbd">⌘K</kbd>
        </div>
      </div>

      <!-- 最近同步 -->
      <div style="flex:1; overflow-y:auto; padding: var(--space-4);">
        <div style="font-size: var(--text-caption-size); font-weight: 500; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: var(--space-3);">最近同步</div>
        <div class="card-stack" style="gap: var(--space-2);">
          <article class="card" style="padding: var(--space-3); border-radius: var(--radius-md);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap: var(--space-3);">
              <div style="min-width:0;">
                <div style="font-weight: 500; color: var(--color-text-primary);">code-review</div>
                <div class="tabular-nums" style="font-size: var(--text-caption-size); color: var(--color-text-tertiary);">2 分钟前 · → 2 个工具</div>
              </div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px; color: var(--color-success); flex-shrink:0;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
          </article>
          <article class="card" style="padding: var(--space-3); border-radius: var(--radius-md);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap: var(--space-3);">
              <div style="min-width:0;">
                <div style="font-weight: 500; color: var(--color-text-primary);">git-workflow</div>
                <div class="tabular-nums" style="font-size: var(--text-caption-size); color: var(--color-text-tertiary);">10 分钟前 · → Claude Code</div>
              </div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px; color: var(--color-success); flex-shrink:0;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
          </article>
          <article class="card" style="padding: var(--space-3); border-radius: var(--radius-md);">
            <div style="display:flex; justify-content:space-between; align-items:center; gap: var(--space-3);">
              <div style="min-width:0;">
                <div style="font-weight: 500; color: var(--color-text-primary);">ts-expert</div>
                <div class="tabular-nums" style="font-size: var(--text-caption-size); color: var(--color-text-tertiary);">1 小时前 · → 2 个工具</div>
              </div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px; color: var(--color-success); flex-shrink:0;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
          </article>
        </div>
      </div>

      <!-- 底部操作区 -->
      <footer style="display:flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-border-default); background: var(--color-bg-subtle);">
        <button class="btn btn--secondary btn--sm" style="flex:1;" onclick="showToast({title:'开始同步全部', variant:'success'})">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px;">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          同步全部
        </button>
        <a class="btn btn--ghost btn--sm" href="./dashboard.html" style="flex:1;">
          打开完整窗口
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px;">
            <path d="M7 17L17 7"/><polyline points="7 7 17 7 17 17"/>
          </svg>
        </a>
      </footer>
    </div>

    <!-- 菜单栏图标状态说明 -->
    <div style="display:flex; gap: var(--space-6); margin-top: var(--space-10); padding: var(--space-4) var(--space-6); background: var(--color-bg-default); border: 1px solid var(--color-border-default); border-radius: var(--radius-lg);">
      <div style="display:flex; align-items:center; gap: var(--space-2);"><span style="width:8px; height:8px; background: var(--color-success); border-radius: 50%;"></span><span style="font-size: var(--text-body-sm-size); color: var(--color-text-secondary);">全部最新</span></div>
      <div style="display:flex; align-items:center; gap: var(--space-2);"><span style="width:8px; height:8px; background: var(--color-warning); border-radius: 50%;"></span><span style="font-size: var(--text-body-sm-size); color: var(--color-text-secondary);">需更新</span></div>
      <div style="display:flex; align-items:center; gap: var(--space-2);"><span style="width:8px; height:8px; background: var(--color-danger); border-radius: 50%;"></span><span style="font-size: var(--text-body-sm-size); color: var(--color-text-secondary);">同步失败</span></div>
      <div style="display:flex; align-items:center; gap: var(--space-2);"><span class="badge__dot badge__dot--pulse" style="background: var(--color-brand-default); width:8px; height:8px;"></span><span style="font-size: var(--text-body-sm-size); color: var(--color-text-secondary);">同步中</span></div>
    </div>

  </body>
</html>
