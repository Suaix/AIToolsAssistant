# manifest.yaml 模板
# 说明：创建新任务时，AI 根据此模板生成 manifest.yaml
# 注意：此文件仅作参考，不应直接使用

# === 基础信息 ===
id: "{{TYPE}}-{{SEQ}}"
title: "{{TITLE}}"
type: "{{TYPE}}"             # FEAT | FIX | REFACTOR
created: "{{DATE}}"
updated: "{{DATE}}"

# === 状态 ===
status: "ANALYSIS"           # ANALYSIS | DESIGN | TECHNICAL | CODING | TESTING | ARCHIVED
sub_status: null             # null | blocked | revision

# === 阶段详情 ===
phases:
  analysis:
    status: "in_progress"    # pending | in_progress | completed | revision
    started: "{{DATE}}"
    completed: null
    output: "01-requirements.md"
  design:
    status: "pending"
    started: null
    completed: null
    output: "02-design.md"
  technical:
    status: "pending"
    started: null
    completed: null
    output: "03-technical.md"
  coding:
    status: "pending"
    started: null
    completed: null
    output: "04-coding-log.md"
  testing:
    status: "pending"
    started: null
    completed: null
    output: "05-testing.md"

# === 门禁 ===
gates:
  analysis_to_design:
    checklist:
      - "需求范围明确"
      - "验收标准（AC）已定义"
      - "用户故事完整"
    passed: []
    skipped: []
    # skipped 格式：
    # - item: "用户故事完整"
    #   reason: "本次为纯技术重构，无用户故事"
    #   date: "2026-04-29"

  design_to_technical:
    checklist:
      - "页面流程完整"
      - "组件规范引用"
      - "交互状态覆盖（空态/加载/错误/成功）"
    passed: []
    skipped: []

  technical_to_coding:
    checklist:
      - "架构设计完整"
      - "接口定义明确"
      - "影响范围已评估"
    passed: []
    skipped: []

  coding_to_testing:
    checklist:
      - "自测通过"
      - "代码已提交"
      - "编码日志已更新"
    passed: []
    skipped: []

  testing_to_archived:
    checklist:
      - "功能验收通过"
      - "UI 走查通过"
      - "文档归档完成"
    passed: []
    skipped: []

# === AI 上下文恢复 ===
context:
  last_action: ""
  next_action: ""
  blockers: []
  decisions: []
  # decisions 格式：
  # - date: "2026-04-29"
  #   decision: "决策内容"
  #   reason: "决策原因"
