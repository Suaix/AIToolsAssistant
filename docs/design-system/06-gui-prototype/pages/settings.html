<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>设置 · aitools</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../tokens.css" />
    <link rel="stylesheet" href="../../components.css" />
    <script src="../scripts/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <nav class="sidebar" aria-label="主导航">
        <div class="sidebar__brand">
          <span class="sidebar__logo" aria-hidden="true">A</span>
          <span class="sidebar__name">aitools</span>
        </div>
        <ul class="sidebar__group">
          <li><a class="nav-item" data-nav="dashboard.html" href="./dashboard.html">
            <svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>
            <span class="nav-item__label">工作台</span>
          </a></li>
        </ul>
        <ul class="sidebar__group">
          <li><a class="nav-item" data-nav="skills.html" href="./skills.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg><span class="nav-item__label">Skills</span><span class="nav-item__badge">12</span></a></li>
          <li><a class="nav-item nav-item--disabled" href="#"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span class="nav-item__label">Commands</span><span class="nav-item__badge">—</span></a></li>
          <li><a class="nav-item nav-item--disabled" href="#"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/></svg><span class="nav-item__label">Agents</span><span class="nav-item__badge">—</span></a></li>
          <li><a class="nav-item nav-item--disabled" href="#"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><polyline points="14 2 14 8 20 8"/></svg><span class="nav-item__label">Rules</span><span class="nav-item__badge">—</span></a></li>
        </ul>
        <ul class="sidebar__group">
          <li><a class="nav-item" data-nav="tools.html" href="./tools.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><span class="nav-item__label">已连接工具</span><span class="nav-item__badge">2</span></a></li>
          <li><a class="nav-item" href="#"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span class="nav-item__label">项目</span><span class="nav-item__badge">3</span></a></li>
        </ul>
        <div class="sidebar__spacer"></div>
        <ul class="sidebar__group">
          <li><a class="nav-item" data-nav="settings.html" href="./settings.html"><svg class="nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nav-item__label">设置</span></a></li>
        </ul>
      </nav>

      <main class="app-main">
        <header class="app-main__header">
          <h1 class="app-main__title">设置</h1>
          <button class="btn btn--ghost btn--icon btn--sm" data-theme-toggle aria-label="切换主题">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </header>

        <div class="app-main__content">
          <div style="max-width: 720px;">

            <!-- 源目录 -->
            <section class="page-section" style="margin-top:0;">
              <div class="page-section__header">
                <h2 class="page-section__title">源目录</h2>
              </div>
              <article class="card">
                <div style="display:flex; align-items:center; gap: var(--space-3); margin-bottom: var(--space-3);">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:20px;height:20px;color: var(--color-brand-default); flex-shrink:0;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                  <span class="font-mono" style="flex:1; color: var(--color-text-primary);">~/.aitools/</span>
                  <button class="btn btn--secondary btn--sm">更改</button>
                  <button class="btn btn--secondary btn--sm">打开</button>
                </div>
                <p style="margin:0; color: var(--color-text-secondary); font-size: var(--text-body-sm-size);">
                  所有 Skill、Agent、Command 的单一事实源。
                </p>
              </article>
            </section>

            <!-- 外观 -->
            <section class="page-section">
              <div class="page-section__header">
                <h2 class="page-section__title">外观</h2>
              </div>
              <article class="card">
                <div style="display:flex; justify-content: space-between; align-items: center; padding: var(--space-2) 0;">
                  <div>
                    <div style="font-weight: 500;">主题</div>
                    <div style="font-size: var(--text-body-sm-size); color: var(--color-text-tertiary);">跟随系统，或强制切换</div>
                  </div>
                  <div style="display:flex; gap: var(--space-1); background: var(--color-bg-muted); padding: 4px; border-radius: var(--radius-md);">
                    <button class="btn btn--ghost btn--sm" onclick="document.documentElement.setAttribute('data-theme','light'); try{localStorage.setItem('aitools-theme','light');}catch(e){}">浅色</button>
                    <button class="btn btn--ghost btn--sm" onclick="document.documentElement.setAttribute('data-theme','dark'); try{localStorage.setItem('aitools-theme','dark');}catch(e){}">深色</button>
                    <button class="btn btn--primary btn--sm" onclick="document.documentElement.removeAttribute('data-theme'); try{localStorage.setItem('aitools-theme','system');}catch(e){}">跟随系统</button>
                  </div>
                </div>
                <div style="display:flex; justify-content: space-between; align-items: center; padding: var(--space-3) 0; border-top: 1px solid var(--color-border-default);">
                  <div>
                    <div style="font-weight: 500;">菜单栏图标</div>
                    <div style="font-size: var(--text-body-sm-size); color: var(--color-text-tertiary);">在菜单栏展示全局同步状态</div>
                  </div>
                  <label style="display:flex; align-items:center; gap: var(--space-2); cursor: pointer;">
                    <input type="checkbox" checked />
                    启用
                  </label>
                </div>
                <div style="display:flex; justify-content: space-between; align-items: center; padding: var(--space-3) 0; border-top: 1px solid var(--color-border-default);">
                  <div>
                    <div style="font-weight: 500;">开机启动</div>
                    <div style="font-size: var(--text-body-sm-size); color: var(--color-text-tertiary);">登录系统后自动常驻</div>
                  </div>
                  <label style="display:flex; align-items:center; gap: var(--space-2); cursor: pointer;">
                    <input type="checkbox" checked />
                    启用
                  </label>
                </div>
              </article>
            </section>

            <!-- 同步行为 -->
            <section class="page-section">
              <div class="page-section__header">
                <h2 class="page-section__title">同步行为</h2>
              </div>
              <article class="card">
                <div style="display:flex; justify-content: space-between; align-items: center; padding: var(--space-2) 0;">
                  <div>
                    <div style="font-weight: 500;">文件变更时</div>
                    <div style="font-size: var(--text-body-sm-size); color: var(--color-text-tertiary);">检测到源文件变化后的处理策略</div>
                  </div>
                  <div style="display:flex; gap: var(--space-1); background: var(--color-bg-muted); padding: 4px; border-radius: var(--radius-md);">
                    <button class="btn btn--primary btn--sm">自动同步</button>
                    <button class="btn btn--ghost btn--sm">手动触发</button>
                  </div>
                </div>
                <div style="display:flex; justify-content: space-between; align-items: center; padding: var(--space-3) 0; border-top: 1px solid var(--color-border-default);">
                  <div>
                    <div style="font-weight: 500;">同步失败时</div>
                    <div style="font-size: var(--text-body-sm-size); color: var(--color-text-tertiary);">通过系统通知提醒</div>
                  </div>
                  <label style="display:flex; align-items:center; gap: var(--space-2); cursor: pointer;">
                    <input type="checkbox" checked />
                    启用
                  </label>
                </div>
              </article>
            </section>

            <!-- 关于 -->
            <section class="page-section">
              <div class="page-section__header">
                <h2 class="page-section__title">关于</h2>
              </div>
              <article class="card">
                <div style="display:flex; align-items:center; justify-content: space-between; gap: var(--space-3);">
                  <div>
                    <div style="font-weight: 600;">aitools <span class="font-mono" style="color: var(--color-text-tertiary);">v0.2.0</span></div>
                    <div style="font-size: var(--text-body-sm-size); color: var(--color-text-tertiary); margin-top: 2px;">你写一次，它到处都在。</div>
                  </div>
                  <div style="display:flex; gap: var(--space-2);">
                    <button class="btn btn--secondary btn--sm">检查更新</button>
                    <button class="btn btn--ghost btn--sm">反馈</button>
                    <button class="btn btn--ghost btn--sm">GitHub</button>
                  </div>
                </div>
              </article>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
